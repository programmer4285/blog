ion of guiding more junior engineers. I review many more PRs these days than I did earlier in my career. In the world of agents and code generation, the skill of reviewing code has become much more important. My difficulty is that I want to explain my intuition to others in order to help them improve their own code. It seems very obvious to me that a particular method or class is not good, and perhaps others agree with me, but I cannot clearly explain why. It is not helpful to ask for PR changes with no explanation as to why. That leads to frustration, not learning.\n\nTo alleviate this, I&#39;ve taken up the practice of writing short pieces about different programming principles. Some codebases I work on have a particular architecture with a guiding philosophy behind it. There are good practices that should be followed when writing tests. Code comments should follow certain principles. It takes a lot of effort to write these explanations, but I have found it to be very rewarding. When people ask me questions or when I ask for a particular change, I can reference this documentation as justification. It is also a great learning tool. If you can explain the correct way to do something and provide the reasoning, people are much more likely to internalize it. This improves the overall quality of codebases that are worked on by many teams.&quot;]}],[0,{&quot;id&quot;:[0,&quot;self-hosting-1&quot;],&quot;title&quot;:[0,&quot;My Self Hosted Journey - The Beginning&quot;],&quot;description&quot;:[0,&quot;The start of my self hosting journey&quot;],&quot;tags&quot;:[1,[]],&quot;body&quot;:[0,&quot;# Why self host?\n\nIt all started with an email... Spotify is increasing the price of my subscription by $2. I&#39;ve been using Spotify for 5 or 6 years now. I can&#39;t remember how many times the subscription price has increased but my guess is two or three. $2 doesn&#39;t seem like much, and I admit that Spotify as a service provides a lot of value. This is more a matter of principle, and was one factor among many others, the last push I needed to start building a home server.\n\nOver the past several months I&#39;ve been taking stock of my digital footprint. This has included changes like shifting towards physical media, getting rid of some social media, and replacing Google services with alternatives.\n\nFor example, I picked up a Switch 2 last year and I&#39;ve only bought physical cartridges. Most of my Switch 1 games were all digital downloads.\n\nWhen Amazon announced that in February 2025 you would no longer be able to download copies of your Kindle books, I stopped buying Kindle books and even got rid of my Kindle. Nowadays I&#39;m very biased towards physical books, although I do have a BOOX Palma and occasionally purchase e-books from Kobo.\n\nThe point is that when you use platforms like Kindle or Spotify, even Steam, you don&#39;t own anything. You are paying for the right to use something, a right which can be revoked if licensing agreements fall through. I&#39;ve seen many stories of Amazon changing e-books, whether that be the book cover or the actual content. Often times when buying a physical copy of a book you would choose an edition you like, with a cover you like, but this stability is not guaranteed with licensed e-books.\n\nAnother factor that pushed me towards self-hosting was that I finally got rid of Windows. It&#39;s common knowledge that Windows continuously gets worse over time, but when I read that it would be either impossible or extremely difficult to disable Copilot, an AI tool that actively spies on you in my opinion, that was reason enough for me to install Ubuntu. The only factor keeping me on Windows was gaming, but Steam&#39;s Proton layer is quite good and works well in my experience.\n\nThe last hurdle to overcome was acquiring hardware. I don&#39;t have an old laptop or PC laying around that I could repurpose as a server. I&#39;ve done some research on mini PC&#39;s and building a NAS, but I wasn&#39;t willing to shell out a lot of money. As it turns out I don&#39;t really play PC games much these days, and my gaming PC has been collecting dust for a few months. I thought to myself that I could run some services on that machine, and if I wanted to play a game I could stop the services or just use my steam deck. And that&#39;s exactly what I did.\n\n# Networking\n\nI&#39;m a programmer by trade, so I&#39;m comfortable with Linux and Docker. The main blocker to setting up a home server was the networking side of things. I knew that I wanted my server to be accessible outside of my home network, but I was concerned about security. I did some research and ended buying a Flint 2 router from GL.iNet. This made my life very easy. I have an old AT&amp;T modem, so my best option was to put it in IP-passthrough mode. That way my router gets the public IP assigned by my ISP.\n\nAfter that I configured a few settings in the router. I gave my server a static IP, enabled the router&#39;s dynamic DNS feature, and turned on the Wireguard VPN server. The Flint 2 provides a free domain name, and if my ISP changes my public IP, the dynamic DNS will automatically update the domain to point to the new IP.\n\nThe Wireguard Server page lets you add clients by scanning a QR code. I did this from the Wireguard app on my phone, and now if I want to access my server when I&#39;m not at home, all I need to do is turn on the VPN on my phone. That gives me a secure tunnel into my home network, and I can access my server via its static IP.\n\n# The fun part -- running services\n\nWith the networking sorted, it was time to start setting up my server. I mentioned Ubuntu earlier, but I actually had Arch Linux installed at the time because I was trying out Omarchy. I landed on using Pop OS for a few reasons: it&#39;s gaming focused, it&#39;s debian based so I figured it would be easy enough to run some docker containers, and the COSMIC desktop looks nice. That satisfies my requirement of doubling as a server &amp; gaming PC.\n\nWith Pop OS installed, the first thing I did was setup SSH. I had to install the OpenSSH server and allow traffic through ufw. That was easy enough, and at this point I could SSH into the server from my laptop and configure everything via the cli.\n\nThe next thing I did was setup Samba. That was also quite easy: install it, allow traffic through ufw, and expose the folders I wanted to access in Samba&#39;s config file. Samba lets me access those folders over my local network, so I can drag and drop files from my laptop.\n\nFinally it was time to run my first docker container: Jellyfin. A media server is a must for any home library, although I don&#39;t have many movies or tv shows. Jellyfin also handles music, so I thought it could be a nice all in one solution. I didn&#39;t run into any issues, but after some research Navidrome seemed like a better choice for music. It has more features and there are some nice iOS client apps available like Amperfy.\n\nNavidrome also led me down the rabbit hole of ripping CDs with XLD and using Picard to tag music. This is another instance where Samba was useful because I configured Picard, which runs on my laptop, to save files to the music folder on my server.\n\nOn a side note, I would advise against ordering CDs from Amazon. Literally half of the CDs I bought had cracked cases and some of the CDs were even scratched.\n\n# Next steps\n\nAt this point I&#39;ve got two containers running on my server, Jellyfin &amp; Navidrome. There are CDs of my favorite albums and artists in the mail and my Spotify subscription has been cancelled. What&#39;s next? Well, there are more subscriptions that I&#39;d like to cancel. I use Dropbox as a file backup solution and I plan to replace that with Nextcloud. I also have an Obsidian sync subscription, so I&#39;ll either run a LiveSync container or potentially use Nextcloud, although I&#39;m not sure how that would work. I&#39;d also like to replace iCloud with Immich for backing up photos. That takes care of most of my remaining subscriptions. Besides that I&#39;d like to run Portainer because it looks cool, and I&#39;m sure I&#39;ll come across other interesting software.\n\nStay tuned for updates!&quot;]}]]]}" ssr client="idle" opts="{&quot;name&quot;:&quot;Search&quot;,&quot;value&quot;:true}" await-children><!--[--><div><button popovertarget="search-bar" class="svelte-1wah7ro"><img src="/_astro/search.8LrQfGO9.svg" alt="Search..." width="20" height="20" class="svelte-1wah7ro"/></button> <div id="search-bar" popover="auto" class="svelte-1wah7ro"><input type="text" placeholder="Type to search..." value=""/> <!--[-1--><!--]--></div></div><!--]--><!--astro:end--></astro-island></li><li><button id="dark-theme-btn" data-astro-cid-l6lhmie6><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon" data-astro-cid-l6lhmie6="true">

</svg></button><script>
  const theme = (() => {
    const localStorageTheme = localStorage.getItem("theme") ?? "";
    if (["dark", "light"].includes(localStorageTheme)) {
      return localStorageTheme;
    }

    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      return "dark";
    }

    return "light";
  })();

  const darkThemeBtn = document.getElementById("dark-theme-btn");
  const lightThemeBtn = document.getElementById("light-theme-btn");

  function setTheme(theme, persistToLocalStorage = true) {
    document.documentElement.setAttribute("data-theme", theme);
    if (persistToLocalStorage) {
      localStorage.setItem("theme", theme);
    }

    if (darkThemeBtn) {
      darkThemeBtn.hidden = theme === "light";
    }

    if (lightThemeBtn) {
      lightThemeBtn.hidden = theme === "dark";
    }
  }

  setTheme(theme, false);

  darkThemeBtn?.addEventListener("click", () => {
    setTheme("light");
  });

  lightThemeBtn?.addEventListener("click", () => {
    setTheme("dark");
  });
